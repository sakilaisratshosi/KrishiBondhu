    <script>
      (function () {
        try {
          var saved = localStorage.getItem('krishibondhu_theme_v1');
          var isDark =
            saved === 'dark' ||
            (saved !== 'light' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', isDark);
        } catch (e) {}
      })();
    </script>
